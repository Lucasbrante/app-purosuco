<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puro Suco V20</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; }
        .header { background: #1a1a1a; color: #fff; padding: 20px; text-align: center; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; position: sticky; top: 0; z-index: 100; }
        .vitrine { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; padding-bottom: 120px; }
        .card { background: #fff; border-radius: 20px; padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #efefef; }
        .card img { max-width: 100%; height: 90px; object-fit: contain; margin-bottom: 10px; }
        .preco { color: #27ae60; font-weight: 800; font-size: 18px; display: block; margin: 10px 0; }
        .btn-add { background: #007bff; color: #fff; border: none; width: 35px; height: 35px; border-radius: 10px; font-weight: bold; font-size: 20px; }
        .barra { position: fixed; bottom: 0; width: 100%; background: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-top: 5px solid #27ae60; box-shadow: 0 -8px 20px rgba(0,0,0,0.1); z-index: 999; }
        .btn-finalizar { background: #2ecc71; color: #fff; border: none; padding: 16px 25px; border-radius: 12px; font-weight: 900; text-transform: uppercase; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-body { background: #fff; padding: 25px; border-radius: 25px; width: 90%; max-width: 360px; text-align: center; }
        .btn-pix { background: #f0f7ff; border: 2px dashed #007bff; color: #007bff; padding: 18px; border-radius: 15px; font-weight: 900; width: 100%; margin: 15px 0; }
    </style>
</head>
<body>

    <div class="header" id="loja-nome">CARREGANDO...</div>
    <div id="vitrine" class="vitrine"></div>
    <div class="barra" id="barra" style="display:none">
        <div style="font-size:22px; font-weight:900;">R$ <span id="total-txt">0,00</span></div>
        <button class="btn-finalizar" onclick="gerarEPagar()">FINALIZAR</button>
    </div>

    <div id="modal">
        <div class="modal-body">
            <h2>Pagamento</h2>
            <p>Total: <strong id="total-m" style="color:#27ae60; font-size:24px;"></strong></p>
            <button class="btn-pix" id="btn-copy" onclick="copiarPix()">GERANDO CÓDIGO...</button>
            <a id="btn-wpp" href="#" target="_blank" style="background:#27ae60; color:#fff; text-decoration:none; padding:18px; border-radius:15px; display:block; font-weight:900;">ENVIAR COMPROVANTE</a>
            <button onclick="document.getElementById('modal').style.display='none'" style="margin-top:20px; background:none; border:none; color:#999; font-weight:bold;">VOLTAR</button>
        </div>
    </div>

    <script>
        // COLA O LINK DA PLANILHA AQUI EMBAIXO:
        const SCRIPT_URL = "COLE_AQUI_O_LINK_DO_PASSO_1";

        let dados = {}; let car = {}; let prods = []; let pixMemo = "";

        async function init() {
            const r = await fetch(SCRIPT_URL);
            dados = await r.json();
            document.getElementById('loja-nome').innerText = dados.nomeLoja;
            let h = '';
            dados.listaProdutos.forEach((p, i) => {
                prods.push({n: p[1], p: parseFloat(p[2])});
                h += `<div class="card"><img src="${p[0]}"><h3>${p[1]}</h3><span class="preco">R$ ${p[2]}</span><div style="display:flex; align-items:center; justify-content:center; gap:10px;"><button class="btn-add" onclick="alt(${i},-1)">-</button><b id="q-${i}">0</b><button class="btn-add" onclick="alt(${i},1)">+</button></div></div>`;
            });
            document.getElementById('vitrine').innerHTML = h;
        }

        function alt(i, d) {
            car[i] = (car[i] || 0) + d; if(car[i] < 0) car[i] = 0;
            document.getElementById(`q-${i}`).innerText = car[i];
            let t = 0; Object.keys(car).forEach(k => t += car[k] * prods[k].p);
            document.getElementById('total-txt').innerText = t.toFixed(2).replace('.', ',');
            document.getElementById('barra').style.display = t > 0 ? 'flex' : 'none';
        }

        async function gerarEPagar() {
            const total = document.getElementById('total-txt').innerText;
            document.getElementById('total-m').innerText = "R$ " + total;
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('btn-copy').innerText = "GERANDO...";
            const r = await fetch(SCRIPT_URL + "?valor=" + total.replace(',', '.'));
            const res = await r.json();
            pixMemo = res.pix;
            document.getElementById('btn-copy').innerText = "1. COPIAR CÓDIGO PIX";
            document.getElementById('btn-wpp').href = `https://wa.me/${dados.whatsapp}?text=${encodeURIComponent('🛒 Pedido Total: R$ ' + total)}`;
        }

        function copiarPix() {
            const area = document.createElement('textarea');
            area.value = pixMemo; document.body.appendChild(area); area.select();
            document.execCommand('copy'); document.body.removeChild(area);
            alert("✅ PIX COPIADO!");
        }
        init();
    </script>
</body>
</html>
