<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puro Suco - Resgate</title>
    <style>
        body { font-family: sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
        .header { background: #1a1a1a; color: white; padding: 20px; text-align: center; font-weight: bold; border-radius: 10px; margin-bottom: 20px; }
        .vitrine { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card img { max-width: 100%; height: 90px; object-fit: contain; margin-bottom: 10px; }
        .preco { color: #27ae60; font-weight: bold; font-size: 18px; }
        .erro { background: #ffebee; color: #c62828; padding: 20px; border-radius: 10px; font-weight: bold; text-align: center; display: none; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="header" id="nome-loja">CARREGANDO...</div>
    <div id="msg-erro" class="erro"></div>
    <div id="vitrine" class="vitrine"></div>

    <script>
        // === COLE AQUI O SEU LINK NOVO DO GOOGLE APPS SCRIPT ===
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_jBqB2KcS6OeeKuUBZSDNvDTXt-jjsBE9RiH3hNY29D_7xdaEBzaW_EiUFZXyRo1RGw/exec";

        async function carregarVitrine() {
            try {
                const resposta = await fetch(SCRIPT_URL);
                if (!resposta.ok) throw new Error("O Google bloqueou o acesso. Refaça a implantação para 'Qualquer Pessoa'.");
                
                const dados = await resposta.json();
                
                if (dados.error) throw new Error("Erro lá na planilha: " + dados.error);

                document.getElementById('nome-loja').innerText = dados.nomeLoja || "PURO SUCO";
                
                let htmlVitrine = '';
                dados.listaProdutos.forEach(p => {
                    let precoFormatado = parseFloat(p[2]).toLocaleString('pt-BR', {minimumFractionDigits: 2});
                    htmlVitrine += `<div class="card">
                        <img src="${p[0]}">
                        <h4>${p[1]}</h4>
                        <span class="preco">R$ ${precoFormatado}</span>
                    </div>`;
                });
                
                document.getElementById('vitrine').innerHTML = htmlVitrine;

            } catch (e) {
                document.getElementById('nome-loja').innerText = "FALHA NA CONEXÃO";
                document.getElementById('msg-erro').style.display = "block";
                document.getElementById('msg-erro').innerText = e.message;
            }
        }

        carregarVitrine();
    </script>

</body>
</html>
