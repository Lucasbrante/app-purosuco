<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Estilos da sua V20 original mantidos */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; }
        .card { border: 1px solid #eee; padding: 10px; text-align: center; border-radius: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .barra { position: fixed; bottom: 0; width: 100%; background: #fff; padding: 15px; border-top: 5px solid #27ae60; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        .btn-finalizar { background: #2ecc71; color: #fff; border: none; padding: 15px 25px; border-radius: 10px; font-weight: bold; }
        
        /* ÁREA DO PIX CONSERTADA */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-body { background: #fff; padding: 20px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; }
        .pix-input-box { width: 100%; padding: 12px; border: 2px solid #007bff; border-radius: 10px; font-size: 12px; margin: 10px 0; background: #f0f7ff; color: #333; }
        .btn-copiar { background: #007bff; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="vitrine" class="grid"></div>
    <div class="barra" id="barra" style="display:none">
        <div>Total: R$ <span id="total-txt">0,00</span></div>
        <button class="btn-finalizar" onclick="abrirModal()">FINALIZAR</button>
    </div>

    <div id="modal">
        <div class="modal-body">
            <h3>Pagamento PIX</h3>
            <p>Total: <strong id="total-m"></strong></p>
            
            <input type="text" id="pix-string" class="pix-input-box" readonly onclick="this.select()">
            <button class="btn-copiar" onclick="copiarPix()">1. COPIAR CÓDIGO PIX</button>

            <a id="btn-wpp" href="#" class="btn-finalizar" style="display:block; text-decoration:none; margin-top:10px;">2. ENVIAR COMPROVANTE</a>
            <button onclick="document.getElementById('modal').style.display='none'" style="margin-top:15px; background:none; border:none; color:#666;">VOLTAR</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzl4eCLXCrsnZeif23fNZpVCJx8zdLolxJMRbcG1ubRW8qBgb6Hkr-G2pnYEAeG0MElA/exec";
        let config = {}; let car = {}; let produtos = [];

        async function init() {
            const r = await fetch(SCRIPT_URL);
            config = await r.json();
            let h = '';
            config.listaProdutos.forEach((p, i) => {
                produtos.push({n: p[1], p: parseFloat(p[2])});
                h += `<div class="card"><h3>${p[1]}</h3><p>R$ ${p[2]}</p><button onclick="add(${i})">Adicionar</button><span id="q-${i}">0</span></div>`;
            });
            document.getElementById('vitrine').innerHTML = h;
        }

        function add(i) {
            car[i] = (car[i] || 0) + 1;
            document.getElementById(`q-${i}`).innerText = car[i];
            let t = 0; Object.keys(car).forEach(k => t += car[k] * produtos[k].p);
            document.getElementById('total-txt').innerText = t.toFixed(2).replace('.',',');
            document.getElementById('barra').style.display = 'flex';
        }

        function abrirModal() {
            let total = document.getElementById('total-txt').innerText;
            document.getElementById('total-m').innerText = "R$ " + total;
            
            // GERADOR DE STRING PIX SIMPLIFICADO E ASSERTIVO
            let chave = config.pix.replace(/[^a-zA-Z0-9@.]/g, '');
            let valor = total.replace(',','.');
            // String estática de teste para garantir a cópia primeiro
            let pixCompleto = "00020101021126330014br.gov.bcb.pix01" + chave.length + chave + "520400005398654" + valor.length + valor + "5802BR5909PUROSUCO6009SAOPAULO62070503***6304";
            
            document.getElementById('pix-string').value = pixCompleto;
            document.getElementById('modal').style.display = 'flex';
        }

        function copiarPix() {
            const input = document.getElementById('pix-string');
            input.select();
            input.setSelectionRange(0, 99999); // Para mobile
            document.execCommand('copy');
            alert("PIX Copiado!");
        }

        init();
    </script>
</body>
</html>
