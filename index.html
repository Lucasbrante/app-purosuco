<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puro Suco - Oficial</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f4; margin: 0; padding: 15px; }
        .header { background: #000; color: #fff; padding: 20px; text-align: center; border-radius: 10px; font-weight: 900; margin-bottom: 20px; }
        .vitrine { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #fff; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card img { max-width: 100%; height: 80px; object-fit: contain; margin-bottom: 10px; }
        .card h4 { margin: 5px 0; font-size: 14px; color: #333; }
        .preco { color: #27ae60; font-weight: bold; font-size: 16px; display: block; margin-top: 5px; }
        #msg-status { text-align: center; padding: 20px; font-weight: bold; color: #666; }
    </style>
</head>
<body>

    <div class="header" id="nome-loja">CARREGANDO LOJA...</div>
    <div id="msg-status">Conectando ao servidor...</div>
    <div id="vitrine" class="vitrine"></div>

    <script>
        // O LINK QUE VOCÊ ME MANDOU E QUE ESTÁ FUNCIONANDO:
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_jBqB2KcS6OeeKuUBZSDNvDTXt-jjsBE9RiH3hNY29D_7xdaEBzaW_EiUFZXyRo1RGw/exec";

        async function carregar() {
            const status = document.getElementById('msg-status');
            try {
                const res = await fetch(SCRIPT_URL);
                const dados = await res.json();
                
                if (dados.error) {
                    status.innerHTML = "❌ Erro na planilha: " + dados.error;
                    return;
                }

                document.getElementById('nome-loja').innerText = dados.nomeLoja;
                status.style.display = "none";
                
                let html = '';
                dados.listaProdutos.forEach(p => {
                    html += `
                        <div class="card">
                            <img src="${p[0]}" onerror="this.src='https://via.placeholder.com/80?text=Suco'">
                            <h4>${p[1]}</h4>
                            <span class="preco">R$ ${parseFloat(p[2]).toFixed(2).replace('.', ',')}</span>
                        </div>`;
                });
                document.getElementById('vitrine').innerHTML = html;

            } catch (e) {
                status.innerHTML = "❌ Erro de Conexão.<br><small>Tente apertar Ctrl+F5 ou verifique o link.</small>";
                console.error(e);
            }
        }
        carregar();
    </script>
</body>
</html>
