<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puro Suco V20 - Final</title>
    <style>
        /* ESTILO ORIGINAL V20 - LIMPO E PROFISSIONAL */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #ffffff; color: #1a1a1a; }
        .header { background: #1a1a1a; color: #fff; padding: 20px; text-align: center; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; position: sticky; top: 0; z-index: 100; }
        .vitrine { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; padding-bottom: 120px; }
        .card { background: #fff; border-radius: 20px; padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 1px solid #efefef; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { max-width: 100%; height: 90px; object-fit: contain; margin-bottom: 10px; }
        .card h3 { font-size: 13px; margin: 5px 0; height: 32px; overflow: hidden; line-height: 1.2; }
        .preco { color: #27ae60; font-weight: 800; font-size: 18px; margin: 8px 0; display: block; }
        .controles { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .btn-add { background: #007bff; color: #fff; border: none; width: 36px; height: 36px; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; }
        .qtd { font-weight: 800; font-size: 16px; min-width: 20px; }
        .barra { position: fixed; bottom: 0; width: 100%; background: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-top: 5px solid #27ae60; box-shadow: 0 -8px 20px rgba(0,0,0,0.1); z-index: 999; }
        .btn-finalizar { background: #2ecc71; color: #fff; border: none; padding: 16px 25px; border-radius: 12px; font-weight: 900; text-transform: uppercase; font-size: 14px; }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-body { background: #fff; padding: 25px; border-radius: 25px; width: 90%; max-width: 360px; text-align: center; }
        .btn-pix { background: #f0f7ff; border: 2px dashed #007bff; color: #007bff; padding: 18px; border-radius: 15px; font-weight: 900; width: 100%; margin: 15px 0; cursor: pointer; font-size: 13px; }
        .btn-wpp { background: #27ae60; color: #fff; text-decoration: none; padding: 18px; border-radius: 15px; display: block; font-weight: 900; font-size: 14px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header" id="loja-nome">CARREGANDO...</div>
    <div id="vitrine" class="vitrine"></div>
    
    <div class="barra" id="barra-pedido" style="display:none">
        <div style="line-height:1">
            <small style="font-size:10px; font-weight:700; color:#999; text-transform:uppercase;">Total</small>
            <div style="font-size:22px; font-weight:900;">R$ <span id="valor-total">0,00</span></div>
        </div>
        <button class="btn-finalizar" onclick="abrirPagamento()">Finalizar</button>
    </div>

    <div id="modal">
        <div class="modal-body">
            <h2 style="margin-top:0">Pagamento</h2>
            <p>Total a pagar: <strong id="m-total" style="font-size:26px; color:#27ae60"></strong></p>
            <button class="btn-pix" id="btn-copy-pix" onclick="copiarPix()">GERANDO CÓDIGO...</button>
            <a id="btn-wpp" href="#" target="_blank" class="btn-wpp">ENVIAR COMPROVANTE</a>
            <button onclick="document.getElementById('modal').style.display='none'" style="margin-top:20px; background:none; border:none; color:#999; font-weight:700; font-size:11px;">VOLTAR</button>
        </div>
    </div>

    <script>
        // LINK DO MOTOR (CONECTADO)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJFheNePSmyffRDfVQn1rt4YkZ4iTCIC2PoJUvvLOit4P7OLjHHXljSI77pXtCVWmjBg/exec";

        let config = {}; let carrinho = {}; let produtos = []; let pixMemo = "";

        async function carregarDados() {
            try {
                const res = await fetch(SCRIPT_URL);
                config = await res.json();
                document.getElementById('loja-nome').innerText = config.nomeLoja;
                let html = '';
                config.listaProdutos.forEach((p, i) => {
                    produtos.push({nome: p[1], preco: parseFloat(p[2])});
                    html += `<div class="card"><img src="${p[0]}"><h3>${p[1]}</h3><b class="preco">R$ ${p[2]}</b><div class="controles"><button class="btn-add" onclick="mudarQtd(${i},-1)">-</button><span class="qtd" id="q-${i}">0</span><button class="btn-add" onclick="mudarQtd(${i},1)">+</button></div></div>`;
                });
                document.getElementById('vitrine').innerHTML = html;
            } catch (e) { alert("Erro ao carregar planilha. Verifique a implantação."); }
        }

        function mudarQtd(i, delta) {
            carrinho[i] = (carrinho[i] || 0) + delta;
            if(carrinho[i] < 0) carrinho[i] = 0;
            document.getElementById(`q-${i}`).innerText = carrinho[i];
            let total = 0; Object.keys(carrinho).forEach(k => total += carrinho[k] * produtos[k].preco);
            document.getElementById('valor-total').innerText = total.toFixed(2).replace('.', ',');
            document.getElementById('barra-pedido').style.display = total > 0 ? 'flex' : 'none';
        }

        async function abrirPagamento() {
            const t = document.getElementById('valor-total').innerText;
            document.getElementById('m-total').innerText = "R$ " + t;
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('btn-copy-pix').innerText = "GERANDO CÓDIGO...";

            // BUSCA O PIX NO GOOGLE SCRIPT
            try {
                const res = await fetch(SCRIPT_URL + "?valor=" + t.replace(',', '.'));
                const dadosPix = await res.json();
                pixMemo = dadosPix.pix;
                document.getElementById('btn-copy-pix').innerText = "1. CLIQUE PARA COPIAR PIX";
            } catch (e) { document.getElementById('btn-copy-pix').innerText = "ERRO AO GERAR PIX"; }

            let msg = `🛒 *Novo Pedido*\nTotal: R$ ${t}`;
            document.getElementById('btn-wpp').href = `https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`;
        }

        function copiarPix() {
            if(!pixMemo) return;
            const area = document.createElement('textarea');
            area.value = pixMemo;
            document.body.appendChild(area);
            area.select();
            area.setSelectionRange(0, 9999);
            document.execCommand('copy');
            document.body.removeChild(area);
            alert("✅ PIX COPIADO! Agora cole no seu Banco.");
        }

        carregarDados();
    </script>
</body>
</html>
