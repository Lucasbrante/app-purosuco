<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puro Suco - Oficial</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
        .header { background: #1a1a1a; color: white; padding: 20px; text-align: center; font-weight: 900; border-radius: 12px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .vitrine { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .card img { max-width: 100%; height: 100px; object-fit: contain; margin-bottom: 10px; border-radius: 8px; }
        .card h4 { margin: 10px 0 5px 0; font-size: 14px; color: #444; }
        .preco { color: #27ae60; font-weight: 900; font-size: 18px; display: block; margin-bottom: 10px; }
        .btn-add { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        #msg-erro { background: #ffebee; color: #c62828; padding: 20px; border-radius: 10px; font-weight: bold; text-align: center; display: none; margin-bottom: 20px; border: 1px solid #ef9a9a; }
    </style>
</head>
<body>

    <div class="header" id="nome-loja">CARREGANDO...</div>
    <div id="msg-erro"></div>
    <div id="vitrine" class="vitrine"></div>

    <script>
        // SEU LINK NOVINHO QUE FUNCIONOU:
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_jBqB2KcS6OeeKuUBZSDNvDTXt-jjsBE9RiH3hNY29D_7xdaEBzaW_EiUFZXyRo1RGw/exec";

        async function carregarLoja() {
            try {
                const res = await fetch(SCRIPT_URL);
                if (!res.ok) throw new Error("Erro na conexão com o Google.");
                const dados = await res.json();
                
                if (dados.error) throw new Error("Erro na planilha: " + dados.error);

                document.getElementById('nome-loja').innerText = dados.nomeLoja || "PURO SUCO";
                
                let html = '';
                dados.listaProdutos.forEach(p => {
                    let preco = parseFloat(p[2]).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
                    html += `
                        <div class="card">
                            <img src="${p[0]}" onerror="this.src='https://via.placeholder.com/100?text=Suco'">
                            <h4>${p[1]}</h4>
                            <span class="preco">${preco}</span>
                            <button class="btn-add">ADICIONAR</button>
                        </div>`;
                });
                document.getElementById('vitrine').innerHTML = html;

            } catch (e) {
                document.getElementById('nome-loja').innerText = "INDISPONÍVEL";
                const divErro = document.getElementById('msg-erro');
                divErro.style.display = "block";
                divErro.innerText = "Atenção: " + e.message;
            }
        }
        carregarLoja();
    </script>
</body>
</html>
